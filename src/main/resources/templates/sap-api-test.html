<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SAP API 테스트 결과</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 2rem;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        form, a {
            display: inline-block;
            margin-right: 1rem;
        }

        form label {
            margin-right: 0.5rem;
            font-weight: 500;
        }

        input[type="number"] {
            padding: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60px;
        }

        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 0.6rem 0.8rem;
            text-align: center;
        }

        th {
            background-color: #3498db;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .pagination {
            margin-top: 1rem;
        }

        .pagination span {
            font-weight: 500;
            margin-right: 0.8rem;
        }

        .pagination a {
            margin-right: 0.5rem;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .pagination a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>SAP API 테스트 결과</h1>

<!-- 사용자 생성 버튼: 개수 입력 -->
<form th:action="@{/generate-employees}" method="get">
    <label>생성할 사용자 수:
        <input type="number" name="count" min="1" th:value="${size}" />
    </label>
    <button type="submit">Mock 사용자 생성</button>
</form>

<!-- 🔥 🔍 사용자 ID 검색 대신 $filter 검색 -->
<form th:action="@{/test-sap-api}" method="get" style="margin-top: 1rem;">
    <label>$filter 조건:
        <input type="text" name="filter" th:value="${filter}">
    </label>
    <button type="submit">검색</button>
</form>

<!-- 새로고침 버튼 -->
<button type="button" onclick="location.href='/test-sap-api';">새로고침</button>


<!-- 🔥 사용자 없음 메시지를 여기로 이동! -->
<div th:if="${notFound}">
    <p style="color: red; font-weight: bold;">사용자를 찾을 수 없습니다.</p>
</div>

<!-- CSV 다운로드 버튼 -->
<button id="downloadCsvBtn" type="button">CSV 다운로드</button>


<!-- 사용자 추가 버튼 -->
<!--<a href="/add">
    <button type="button">사용자 추가</button>
</a>-->

<table id="userTable">
    <thead>
    <tr>
        <th>PERNR</th>
        <th>ENAME</th>
        <th>ORGEH</th>
        <th>ORGEHNAME</th>
        <th>PLANS</th>
        <th>EMAIL</th>
        <th>BEGDA</th>
        <th>ENDDA</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employeeList}">
        <td th:text="${emp.pernr}"></td>
        <td th:text="${emp.ename}"></td>
        <td th:text="${emp.orgeh}"></td>
        <td th:text="${emp.orgehName}"></td>
        <td th:text="${emp.plans}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.begda}"></td>
        <td th:text="${emp.endda}"></td>
        <td>
            <button type="button" class="view-detail-btn" th:data-employee-id="${emp.pernr}">정보 보기</button>
        </td>
        <td>
            <button type="button" class="check-auth-btn" th:data-employee-id="${emp.pernr}">권한 검사</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- 페이징: $filter 유지 -->
<div class="pagination">
    <span th:text="'Page: ' + ${currentPage}"></span>
    <a th:href="@{/test-sap-api(page=${currentPage - 1}, size=${size}, filter=${filter})}" th:if="${currentPage > 1}">이전</a>
    <a th:href="@{/test-sap-api(page=${currentPage + 1}, size=${size}, filter=${filter})}">다음</a>
</div>

<div id="employeeDetailModal" style="
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    padding: 1.5rem;
    z-index: 1000;
    width: 450px;
    max-height: 80%;
    overflow-y: auto;
    font-family: 'Segoe UI', sans-serif;
    color: #333;
">
    <h2 style="margin-top: 0; color: #3498db;">직원 정보</h2>
    <div id="employeeDetailContent" style="margin-bottom: 1rem;"></div>
    <button id="viewMoreBtn" style="margin-right: 0.5rem; background: #2ecc71; color: #fff; border: none; padding: 0.3rem 0.7rem; border-radius: 4px; cursor: pointer;">세부보기</button>
    <button onclick="document.getElementById('employeeDetailModal').style.display='none'" style="
        background: #3498db;
        color: #fff;
        border: none;
        padding: 0.4rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s;">
        닫기
    </button>
</div>

<div id="employeeFullDetailModal" style="
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    padding: 1.5rem;
    z-index: 1001;
    width: 500px;
    max-height: 80%;
    overflow-y: auto;
    font-family: 'Segoe UI', sans-serif;
    color: #333;
">
    <h2 style="margin-top: 0; color: #27ae60;">세부 정보</h2>
    <div id="employeeFullDetailContent" style="margin-bottom: 1rem;"></div>
    <div style="text-align: right;">
        <button onclick="document.getElementById('employeeFullDetailModal').style.display='none'"
                style="background: #27ae60; color: #fff; border: none; padding: 0.3rem 0.7rem; border-radius: 4px; cursor: pointer;">
            닫기
        </button>
    </div>
</div>


<script>
    document.getElementById('downloadCsvBtn').addEventListener('click', function() {
        const table = document.getElementById('userTable');
        let csvContent = '';

        // 헤더 추출
        const headers = table.querySelectorAll('thead tr th');
        const headerArray = Array.from(headers).map(th => `"${th.innerText}"`);
        csvContent += headerArray.join(',') + '\n';

        // 데이터 추출
        const rows = table.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const cols = row.querySelectorAll('td');
            const rowArray = Array.from(cols).map(td => `"${td.innerText}"`);
            csvContent += rowArray.join(',') + '\n';
        });

        // CSV 다운로드 트리거
        const BOM = '\uFEFF'; // UTF-8 BOM
        const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'user_list.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    <!-- 정보 보기 코드 -->
    document.querySelectorAll('.view-detail-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const employeeId = btn.getAttribute('data-employee-id');
            const url = `/employee-detail?employeeId=${encodeURIComponent(employeeId)}`;

            fetch(url)
                .then(response => response.json().then(json => ({status: response.status, body: json})))
                .then(({status, body}) => {
                    if (status === 200 && body.d) {
                        const data = body.d;
                        let html = `
                        <dl>
                            <dt>ID</dt><dd>${data.employeeId || '-'}</dd>
                            <dt>이름</dt><dd>${data.firstName || '-'} ${data.lastName || '-'}</dd>
                            <dt>부서</dt><dd>${data.departmentName || '-'}</dd>
                            <dt>직급</dt><dd>${data.position || '-'}</dd>
                            <dt>이메일</dt><dd>${data.workEmail || '-'}</dd>
                            <dt>주소</dt><dd>${data.address || '-'}</dd>
                            <dt>입사일</dt><dd>${data.hireDate || '-'}</dd>
                        </dl>
                        <strong>역할 및 권한</strong>
                        <ul>
                    `;
                        if (data.roles && Array.isArray(data.roles)) {
                            data.roles.forEach(r => {
                                html += `<li><strong>${r.roleName}</strong> (${r.description})<br/>권한: ${r.privileges.map(p => p.privilegeName).join(', ')}</li>`;
                            });
                        } else {
                            html += '<li>역할 정보가 없습니다.</li>';
                        }
                        html += '</ul>';

                        document.getElementById('employeeDetailContent').innerHTML = html;
                        document.getElementById('employeeDetailModal').style.display = 'block';
                    } else if (body.error) {
                        alert(`오류: ${body.error.message}`);
                    }
                })
                .catch(error => alert("직원 정보 조회 중 오류가 발생했습니다."));
        });
    });


    document.addEventListener("DOMContentLoaded", () => {
        const detailModal = document.getElementById('employeeDetailModal');
        const fullDetailModal = document.getElementById('employeeFullDetailModal');
        const viewMoreBtn = document.getElementById('viewMoreBtn');

        // 정보 보기 버튼
        document.querySelectorAll('.view-detail-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const employeeId = btn.getAttribute('data-employee-id');
                fetch(`/employee-detail?employeeId=${encodeURIComponent(employeeId)}`)
                    .then(response => response.json())
                    .then(body => {
                        if (body.d) {
                            const data = body.d;
                            let html = `<dl>
                            <dt>ID</dt><dd>${data.employeeId || '-'}</dd>
                            <dt>이름</dt><dd>${data.firstName || '-'} ${data.lastName || '-'}</dd>
                            <dt>부서</dt><dd>${data.departmentName || '-'}</dd>
                            <dt>직급</dt><dd>${data.position || '-'}</dd>
                            <dt>이메일</dt><dd>${data.workEmail || '-'}</dd>
                            <dt>주소</dt><dd>${data.address || '-'}</dd>
                            <dt>입사일</dt><dd>${data.hireDate || '-'}</dd>
                        </dl>`;
                            document.getElementById('employeeDetailContent').innerHTML = html;
                            viewMoreBtn.setAttribute('data-employee-id', employeeId); // ✅ 여기에 항상 세팅
                            detailModal.style.display = 'block';
                        } else if (body.error) {
                            alert(`오류: ${body.error.message}`);
                        }
                    });
            });
        });

        // 세부보기 버튼
        viewMoreBtn.addEventListener('click', () => {
            const employeeId = viewMoreBtn.getAttribute('data-employee-id');
            if (!employeeId) {
                alert("직원을 먼저 선택해 주세요.");
                return;
            }
            fetch(`/employee-detail?employeeId=${encodeURIComponent(employeeId)}`)
                .then(response => response.json())
                .then(body => {
                    if (body.d) {
                        const data = body.d;
                        let html = '<dl>';
                        // 주요 필드(가독성 개선)
                        const mainKeys = [
                            "employeeId","firstName","lastName","middleName","birthDate","gender","nationality",
                            "maritalStatus","position","jobTitle","department","departmentName","hireDate",
                            "terminationDate","workEmail","workPhone","mobilePhone","address","bankAccount","taxId"
                        ];
                        mainKeys.forEach(key => {
                            if (data[key] !== undefined) {
                                html += `<dt style="font-weight:bold;margin-top:0.4em;">${key}</dt><dd>${data[key] || '-'}</dd>`;
                            }
                        });
                        // roles 상세 구조화
                        if (Array.isArray(data.roles)) {
                            html += `<dt style="font-weight:bold;margin-top:0.6em;">Roles</dt>`;
                            html += `<dd><ul style="padding-left:1em;">`;
                            data.roles.forEach(role => {
                                html += `<li style="margin-bottom:0.8em;">
                                <div><b>역할명:</b> ${role.roleName || '-'} <small style="color:#888;">(${role.roleId || ''})</small></div>
                                <div style="margin-left:0.6em;"><b>설명:</b> ${role.description || '-'}</div>
                                <div style="margin-left:0.6em;margin-top:0.2em;">
                                    <b>권한:</b>
                                    <ul style="padding-left:1em;">${
                                    (role.privileges||[]).map(p =>
                                        `<li>${p.privilegeName || '-'} <small style="color:#888;">(${p.privilegeId||''})</small>: ${p.description||'-'}</li>`
                                    ).join('')
                                }</ul>
                                </div>
                            </li>`;
                            });
                            html += '</ul></dd>';
                        }
                        html += '</dl>';
                        document.getElementById('employeeFullDetailContent').innerHTML = html;
                        fullDetailModal.style.display = 'block';
                    } else if (body.error) {
                        alert(`오류: ${body.error.message}`);
                    }
                });
        });

        // 모달 닫힐 때 employeeId도 비우기 (안전)
        detailModal.querySelector('button[onclick]').addEventListener('click', () => {
            viewMoreBtn.removeAttribute('data-employee-id');
        });
    });


    // 권한 검사
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.check-auth-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const employeeId = btn.getAttribute('data-employee-id');

                // 팝업으로 입력 받을 권한 객체/필드/값
                const object = prompt("권한 객체 ID를 입력하세요 (예: S_TCODE):");
                if (!object) return;
                const field = prompt("필드명을 입력하세요 (예: TCD):");
                if (!field) return;
                const value = prompt("필드값을 입력하세요 (예: SM30):");
                if (!value) return;

                // IAM 서버의 권한 검사 API 호출
                const url = `/check-authorization?employeeId=${encodeURIComponent(employeeId)}&object=${encodeURIComponent(object)}&field=${encodeURIComponent(field)}&value=${encodeURIComponent(value)}`;

                fetch(url)
                    .then(response => response.json().then(json => ({ status: response.status, body: json })))
                    .then(({ status, body }) => {
                        if (status === 200 && body.d) {
                            // OData2 정상 응답: body.d.hasAuthorization
                            alert(
                                `사용자 ${employeeId}\n` +
                                `권한 객체 : ${object}\n필드 : ${field}\n값 : ${value}\n\n` +
                                `권한 존재 여부 : ${body.d.hasAuthorization ? "✅ 있음" : "❌ 없음"}`
                            );
                        } else if (body.error) {
                            alert(`[오류]\n${body.error.message}`);
                        } else {
                            alert("권한 검사 결과를 확인할 수 없습니다.");
                        }
                    })
                    .catch(error => {
                        console.error(error);
                        alert("권한 검사 중 오류가 발생했습니다.");
                    });
            });
        });
    });
</script>
</body>
</html>
